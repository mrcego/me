name: CI

# Invoked by Deploy (main) and Netlify preview (PRs). No direct pull_request
# trigger — avoids running validate twice when the preview workflow calls this.

on:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests + coverage (≥80%)
        run: pnpm test:coverage

      - name: Generate static site
        run: pnpm run generate:netlify
        env:
          NUXT_PUBLIC_CONTACT_PROVIDER: netlify

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E tests (SSG + CSP)
        run: pnpm test:e2e
        env:
          CI: true

      - name: Install Chrome for Lighthouse CI
        uses: browser-actions/setup-chrome@v1

      - name: Lighthouse CI (soft-fail budgets)
        continue-on-error: true
        run: |
          node scripts/serve-ssg-with-csp.mjs &
          echo $! > /tmp/ssg.pid
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          pnpm lhci
          kill "$(cat /tmp/ssg.pid)" 2>/dev/null || true
        env:
          LHCI_BASE_URL: http://127.0.0.1:4173
          CHROME_PATH: /usr/bin/google-chrome

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: .output/public
          retention-days: 2
