name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'redirect/**'
      - '.github/workflows/deploy.yml'
      - '**.md'
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests + coverage (≥80%)
        run: pnpm test:coverage

      - name: Generate static site
        run: pnpm run generate:netlify
        env:
          NUXT_PUBLIC_CONTACT_PROVIDER: netlify

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E tests (SSG + CSP)
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: .output/public
          retention-days: 2

  # Same prebuilt artifact as prod — never re-generate on Netlify (buildId/CSP desync).
  # Stable URL: https://pr-<n>--<site>.netlify.app (alias updates on each PR push).
  preview:
    name: Netlify preview
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download validated site
        uses: actions/download-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: .output/public

      - name: Deploy preview to Netlify
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          json=$(npx --yes netlify-cli@latest deploy \
            --no-build \
            --dir=.output/public \
            --alias="pr-${{ github.event.number }}" \
            --message "PR #${{ github.event.number }} ${GITHUB_SHA}" \
            --json)
          echo "$json" | tee /tmp/netlify-deploy.json
          deploy_url=$(echo "$json" | jq -r '.deploy_url // empty')
          if [ -z "$deploy_url" ] || [ "$deploy_url" = "null" ]; then
            echo "::error::Netlify deploy did not return deploy_url"
            exit 1
          fi
          echo "deploy_url=$deploy_url" >> "$GITHUB_OUTPUT"
          echo "Preview: $deploy_url"

      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          marker='<!-- netlify-deploy-preview -->'
          body="$(printf '%s\n\n### Netlify Deploy Preview\n\n%s\n\nPrebuilt SSG artifact from CI (`--no-build`). Alias: `pr-%s` — updates on each push to this PR.\n' \
            "$marker" "$DEPLOY_URL" "$PR_NUMBER")"
          existing=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n1 || true)
          if [ -n "${existing}" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${existing}" -f body="${body}"
          else
            gh pr comment "${PR_NUMBER}" --body "${body}"
          fi
