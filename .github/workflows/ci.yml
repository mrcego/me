name: CI

# Invoked by Deploy (main) and Netlify preview (PRs). No direct pull_request
# trigger — avoids running validate twice when the preview workflow calls this.

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests + coverage (≥80%)
        run: pnpm test:coverage

      - name: Generate static site
        run: pnpm run generate:netlify
        env:
          NUXT_PUBLIC_CONTACT_PROVIDER: netlify

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E tests (SSG + CSP)
        run: pnpm test:e2e
        env:
          CI: true

      - name: Lighthouse CI (soft-fail budgets)
        continue-on-error: true
        run: SKIP_GENERATE=1 pnpm test:perf
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: .output/public
          retention-days: 2
