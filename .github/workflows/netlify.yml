name: Deploy to Netlify

on:
  push:
    branches: [main]
    paths-ignore:
      - 'redirect/**'
      - '.github/workflows/deploy.yml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download validated site
        uses: actions/download-artifact@v8
        with:
          name: site-${{ github.sha }}
          path: .output/public

      - name: Deploy to Netlify
        # Upload the prebuilt .output/public only. CLI 27 builds by default unless
        # --no-build; a second generate changes Nuxt buildId and used to desync CSP.
        # Deploy is blocked unless the validate job (lint/unit/e2e) succeeded.
        run: pnpm exec netlify deploy --prod --no-build --dir=.output/public --message "Deploy ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Submit URLs to IndexNow
        run: pnpm indexnow:submit
